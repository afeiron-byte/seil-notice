<style>
/* ===== 가정통신문 문서 양식 (세일고등학교) ===== */
.nd{--nd-gray:#808080;--nd-muted:#595959;--nd-hdr:#e7e6e6;--nd-lbl:#f2f2f2;

.nd-inner > :first-child{margin-top:0 !important}

/* 머리 부분 */
.nd-top{display:flex;justify-content:flex-end;min-height:9.3mm}

.nd-hdr-title{background:var(--nd-hdr);border-right:1pt solid var(--nd-gray);white-space:nowrap;font-size:24pt;font-weight:700;line-height:1.2}
.nd-hdr-slogan img{width:46.6mm;height:auto}
.nd-title{font-size:16pt;font-weight:700;text-align:center;line-height:1.4;margin:4mm 0 2.5mm;word-break:keep-all}

/* 본문 */
.nd-p{text-align:justify;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}

.nd-gap{height:2.4mm}

.nd-principal{font-size:20pt;font-weight:700;text-align:center;letter-spacing:3pt;line-height:1.45}

.nd-flow .nd-hdr{min-height:12.35cqw}
.nd-flow .nd-hdr > div{padding:0 .88cqw}
.nd-flow .nd-hdr-emblem img{width:9.95cqw}

:root{--bg:#e9edf2;--line:#d5dbe3;--ink:#1d2430;--sub:#5b6573;--accent:#1d4f91;--soft:#eaf1fb;--ok:#1b6e34;--okbg:#e7f4ea;--err:#c62828;--errbg:#fdecec;--warn:#8a5a00;--warnbg:#fff4dc}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕','Nanum Gothic','나눔고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar .t{font-weight:700;font-size:15px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{-webkit-appearance:none;appearance:none;border:1px solid #c3cad3;background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55}
.btn.big{display:block;width:100%;padding:15px;font-size:17px;border-radius:12px}
.wrap{max-width:840px;margin:14px auto 40px;padding:0 10px}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:15px;line-height:1.55}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.err{background:var(--errbg);color:var(--err)}
.sheet-card{background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.12);padding:clamp(16px,6vw,64px) clamp(16px,7vw,76px) clamp(20px,6vw,56px)}
.loading{text-align:center;color:var(--sub);padding:60px 0;font-size:16px}
.submit-area{margin-top:22px}
.submit-area .help{font-size:14px;color:var(--sub);margin:8px 0 0;text-align:center}
.done{margin-top:14px;border-radius:12px;padding:14px;background:var(--okbg);color:var(--ok);font-size:16px;line-height:1.6;text-align:center}
.done b{font-size:18px}
.fab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:25;box-shadow:0 6px 18px rgba(29,79,145,.35);border-radius:999px;padding:13px 22px;font-size:16px}
.fab[hidden]{display:none}

/* ---- 회신서 입력칸 ---- */
.nd-flow .nd-slip-table td{padding:1mm 1.5mm}
.nd-flow .nd-slip-table input,.nd-flow .nd-slip-table select,.nd-flow .nd-slip-table textarea{
  width:100%;font-size:16px;border:0;border-bottom:1.5px solid #9aa5b4;background:#f7f9fc;border-radius:5px 5px 0 0;padding:6px 6px;min-height:36px}
.nd-flow .nd-slip-table textarea{resize:vertical;min-height:52px;line-height:1.45;border:1.5px solid #c3cad3;border-radius:6px}
.nd-flow .nd-slip-table input:focus,.nd-flow .nd-slip-table select:focus,.nd-flow .nd-slip-table textarea:focus{outline:2px solid #2f6fc0;outline-offset:0;background:#fff}
.nd-flow .nd-slip-table .cls{display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;letter-spacing:0}
.nd-flow .nd-slip-table .cls select{width:3.3em;padding:6px 2px;text-align:center}
.nd-flow .nd-slip-table .cls input{width:2.6em;text-align:center;padding:6px 2px}
.nd-flow .bad{outline:2.5px solid var(--err) !important;background:var(--errbg) !important}
.nd-flow .nd-options{gap:10px 12px;margin:3mm 0}
.nd-flow .nd-opt{position:relative;border:1.5px solid #c3cad3;border-radius:12px;padding:10px 16px;cursor:pointer;background:#fff;font-size:16px}
.nd-flow .nd-opt input{position:absolute;opacity:0;width:1px;height:1px}
.nd-flow .nd-opt:has(input:checked){border-color:var(--accent);background:var(--soft);font-weight:700}
.nd-flow .nd-opt:has(input:focus-visible){outline:2px solid #2f6fc0;outline-offset:2px}
.nd-flow .nd-opt input:checked + .nd-box::after{content:"✓";font-weight:700;color:var(--accent)}
.nd-flow .nd-options.bad{outline-offset:4px;border-radius:12px}
.nd-flow .nd-sline{min-height:15mm;padding-right:6mm}
.nd-flow .nd-sline .nm{min-width:24mm;width:auto;max-width:40mm;margin-right:9mm}
.nd-flow .sig-slot{position:absolute;right:-6mm;top:50%;transform:translateY(-50%);width:32mm;height:13mm;padding:0;border:2px dashed var(--accent);border-radius:8px;
  background:rgba(234,241,251,.92);color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nd-flow .sig-slot img{display:none;max-width:100%;max-height:100%;object-fit:contain}
.nd-flow .sig-slot.signed{background:transparent;border:1px dashed transparent}
.nd-flow .sig-slot.signed img{display:block}
.nd-flow .sig-slot.signed .ph{display:none}
.nd-flow .sig-slot.signed:hover,.nd-flow .sig-slot.signed:focus-visible{border-color:#9aa5b4}

@media (max-width:560px){
  .nd-flow .nd-principal{font-size:17pt;letter-spacing:1.5pt}
  .nd-flow .nd-p,.nd-flow .nd-slip-text{text-align:left}
  .nd-flow .nd-slip-table{display:block;border-top:.75pt solid #000;border-left:.75pt solid #000}
  .nd-flow .nd-slip-table colgroup{display:none}
  .nd-flow .nd-slip-table tbody{display:block}
  .nd-flow .nd-slip-table tr{display:grid;grid-template-columns:6.4em 1fr}
  .nd-flow .nd-slip-table th,.nd-flow .nd-slip-table td{display:flex;align-items:center;height:auto;min-height:12mm;border:0;
    border-right:.75pt solid #000;border-bottom:.75pt solid #000}
  .nd-flow .nd-slip-table th{justify-content:center;flex-direction:column;text-align:center}
  .nd-flow .nd-slip-table .cls{justify-content:flex-start}
  .nd-flow .nd-opt{flex:1 1 100%;justify-content:flex-start}
}

/* ---- 서명 창 ---- */
body.sp-open{overflow:hidden}
.sp-modal{position:fixed;inset:0;z-index:80;background:rgba(15,20,30,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.sp-modal[hidden]{display:none}
.sp-box{background:#fff;border-radius:16px;width:min(620px,100%);padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sp-head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.sp-head strong{font-size:19px}
.sp-head span{font-size:14px;color:var(--sub)}
.sp-pad{position:relative;width:100%;aspect-ratio:2/1;max-height:calc(100vh - 150px);border:1.5px solid #c3cad3;border-radius:12px;background:#fff;overflow:hidden;touch-action:none}
.sp-base{position:absolute;left:8%;right:8%;bottom:24%;border-bottom:1.5px dashed #c3cad3}
.sp-wm{position:absolute;left:8%;bottom:26%;color:#b8c0cb;font-size:14px}
#sp-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sp-act{display:flex;gap:8px;margin-top:12px}
.sp-grow{margin-right:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;width:max-content;max-width:calc(100vw - 32px);background:#222b36;color:#fff;
  padding:12px 16px;border-radius:10px;font-size:15px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--err)}
.toast.ok{background:var(--ok)}

#printHost{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  body > *{display:none !important}
  body > #printHost{display:block !important}
  #printHost .nd-page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  #printHost .nd-page:last-child{break-after:auto;page-break-after:auto}
}
</style>

<script>
/* ===== 가정통신문 공통: 기본 문장, 문서 만들기, A4 쪽 나누기 ===== */
var ND = (function () {

      if (v == null || v === false) return;
      if (k === 'class') e.className = v;

  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseISO(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || ''));

  }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function fmtDate(iso) { var d = parseISO(iso); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; }
  function fmtDay(iso) { var d = parseISO(iso); return fmtDate(iso) + '(' + DAYS[d.getDay()] + ')'; }
  function fmtMD(iso) { var d = parseISO(iso); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + DAYS[d.getDay()] + ')'; }

  /* 받침 유무에 따라 조사 고르기: josa('활동', '을/를') */
  function hasJong(word) {
    var s = String(word || '').replace(/[\s)\]」』"'.]+$/, '');
    if (!s) return false;
    var c = s.charCodeAt(s.length - 1);

      '<div class="sp-head"><strong id="sp-title">서명</strong><span>손가락이나 펜으로 칸 안에 서명해 주세요.</span></div>' +
      '<div class="sp-pad"><div class="sp-base"></div><div class="sp-wm">서명</div><canvas id="sp-canvas"></canvas></div>' +
      '<div class="sp-act"><button type="button" class="btn sp-grow" id="sp-clear">지우기</button>' +
      '<button type="button" class="btn" id="sp-cancel">취소</button><button type="button" class="btn primary" id="sp-done">완료</button></div></div>';
    document.body.appendChild(modal);
    canvas = el('sp-canvas'); ctx = canvas.getContext('2d');
    canvas.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      cur = [pt(e)]; strokes.push(cur); schedule();
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!cur) return;
      e.preventDefault();
      var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      if (!evs.length) evs = [e];
      evs.forEach(function (ev) { cur.push(pt(ev)); });
      schedule();
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { canvas.addEventListener(t, function () { cur = null; }); });
    el('sp-clear').addEventListener('click', function () { strokes = []; draw(); });
    el('sp-cancel').addEventListener('click', close);
    el('sp-done').addEventListener('click', function () {
      var n = strokes.reduce(function (a, s) { return a + s.length; }, 0);
      if (n < 3) { if (window.toast) window.toast('서명 칸에 서명해 주세요.', 'err'); return; }
      var cb = done, list = strokes;
      close();
      if (cb) cb(exportPNG(list), list);
    });
    window.addEventListener('resize', function () { if (!modal.hidden) fit(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal && !modal.hidden) close(); });
  }
  function pt(e) { var r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.width]; }
  function setPen(c) { c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#111'; c.fillStyle = '#111'; }
  function paint(c, pts, scale, ox, oy, lw) {
    if (!pts.length) return;
    c.lineWidth = lw;
    if (pts.length === 1) { c.beginPath(); c.arc(pts[0][0] * scale - ox, pts[0][1] * scale - oy, lw / 2, 0, Math.PI * 2); c.fill(); return; }
    c.beginPath(); c.moveTo(pts[0][0] * scale - ox, pts[0][1] * scale - oy);
    for (var i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      c.quadraticCurveTo(pts[i][0] * scale - ox, pts[i][1] * scale - oy, mx * scale - ox, my * scale - oy);
    }
    var l = pts[pts.length - 1]; c.lineTo(l[0] * scale - ox, l[1] * scale - oy); c.stroke();
  }
  function draw() {
    var w = canvas.width, hh = canvas.height;
    ctx.clearRect(0, 0, w, hh); setPen(ctx);
    strokes.forEach(function (s) { paint(ctx, s, w, 0, 0, LW * w); });
  }
  function fit() {
    var r = canvas.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    draw();
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; draw(); }); }
  function exportPNG(list) {
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    list.forEach(function (s) { s.forEach(function (p) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }); });
    var S = 700, lw = LW * S, pad = lw * 1.5 + 4, c = document.createElement('canvas');
    c.width = Math.max(10, Math.ceil((x1 - x0) * S + pad * 2)); c.height = Math.max(10, Math.ceil((y1 - y0) * S + pad * 2));
    var g = c.getContext('2d'); setPen(g);
    list.forEach(function (s) { paint(g, s, S, x0 * S - pad, y0 * S - pad, lw); });
    return c.toDataURL('image/png');
  }
  function open(title, prev, cb) {
    ensure();
    strokes = (prev || []).map(function (s) { return s.slice(); });
    done = cb;
    el('sp-title').textContent = title;
    modal.hidden = false;
    document.body.classList.add('sp-open');
    requestAnimationFrame(fit);
  }
  function close() { modal.hidden = true; cur = null; done = null; document.body.classList.remove('sp-open'); }
  return { open: open };
})();

</script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var API = /^https:\/\//.test(window.API_URL) ? window.API_URL : '';
  var S = { id: '', doc: null, assets: {}, sig: { student: '', parent: '' }, strokes: { student: null, parent: null }, busy: false };
  var tt = 0;
  function toast(msg, kind, ms) {
    var t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, ms || 3500);
  }
  window.toast = toast;
  function banner(msg, kind) {
    var b = $('#banner'); b.innerHTML = '';
    if (!msg) return;
    var d = document.createElement('div'); d.className = 'banner ' + kind; d.textContent = msg; b.appendChild(d);
  }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function api(action, data) {
    if (!API) return Promise.reject(new Error('서버 주소가 없습니다.'));
    return fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, data || {})) })
      .then(function (r) { return r.text(); }, function () { throw new Error('인터넷 연결을 확인하고 다시 눌러 주세요.'); })
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error('잠시 후 다시 눌러 주세요. (서버 응답 오류)'); }
        if (!j.ok) throw new Error(j.error || '처리하지 못했습니다.');
        return j;
      });
  }
  function noticeId() {
    var p = (window.PRELOAD && window.PRELOAD.id) || '';
    if (!p) { var m = /[?&]n=([a-z0-9]+)/.exec(location.search); p = m ? m[1] : ''; }
    return p;
  }

  /* ---------- 문서 보이기 ---------- */
  function show(doc, assets) {
    S.doc = doc;
    $('#loading').hidden = true;
    $('#barTitle').textContent = doc.title;
    document.title = doc.title + ' - 세일고등학교';
    ND.renderFlow(doc, assets, $('#docHost'), { interactive: doc.type === 'reply' });
    $('#btnPrint').hidden = false;
    if (doc.type === 'reply') setupReply(doc);
  }
  function prep(raw) {
    var a = raw || {};
    return Promise.all([ND.trimImage(a.emblem, 360), ND.trimImage(a.slogan, 700), ND.trimImage(a.incheon, 700)])
      .then(function (r) { return { emblem: r[0], slogan: r[1], incheon: r[2] }; });
  }
  function start() {
    var P = window.PRELOAD;
    S.id = noticeId();
    // 미리 넣어 준 내용이 없으면 Apps Script 화면 주소에서 ?n= 값을 읽음
    if (!S.id && !(P && P.notice) && window.google && google.script && google.script.url) {
      google.script.url.getLocation(function (loc) {
        S.id = String(((loc && loc.parameter) || {}).n || '');
        load2(P);
      });
      return;
    }
    load2(P);
  }
  function load2(P) {
    if (P && P.missing) { fail('가정통신문을 찾을 수 없어요. 받은 주소를 다시 확인해 주세요.'); return; }
    var got = P && P.notice ? Promise.resolve({ notice: P.notice, assets: P.assets })
      : S.id ? api('getNotice', { id: S.id }) : Promise.reject(new Error('가정통신문 주소가 올바르지 않아요. 받은 주소나 QR코드로 다시 열어 주세요.'));
    got.then(function (j) {
      return prep(j.assets).then(function (a) { S.assets = a; show(j.notice, a); });
    }).catch(function (e) { fail(e.message); });
  }
  function fail(msg) {
    $('#loading').hidden = true; banner(msg, 'err');
    if (!S.id && /\.github\.io$/.test(location.hostname)) {   // 교사가 주소만 열었을 때
      var p = document.createElement('p'); p.style.cssText = 'text-align:center;margin:30px 0;font-size:16px';
      var a = document.createElement('a'); a.href = 'make.html'; a.className = 'btn primary'; a.style.textDecoration = 'none';
      a.textContent = '선생님: 가정통신문 만들기 화면으로 가기';
      p.appendChild(a); $('#docHost').appendChild(p);
    }
  }

  /* ---------- 회신서 ---------- */
  function el(id) { return document.getElementById(id); }
  function setupReply(doc) {
    $('#submitArea').hidden = false;
    var r = doc.reply || {};
    var today = ND.toISO(new Date());
    var prev = null; try { prev = JSON.parse(load('nv_sub_' + S.id) || 'null'); } catch (e) {}
    if (prev) banner('이 기기에서 ' + prev.time + '에 회신서를 제출했어요 (' + prev.who + '). 고칠 내용이 있으면 다시 작성해서 제출하면 돼요.', 'ok');
    else if (r.deadline && today > r.deadline) banner('회신 기한(' + ND.fmtDay(r.deadline) + ')이 지났어요. 그래도 제출할 수 있어요.', 'warn');

    // 학생·보호자 이름을 서명 줄에도 보이기
    function mirror(src, dst) { var s = el(src), d = el(dst); if (!s || !d) return; s.addEventListener('input', function () { d.textContent = s.value.trim(); }); }
    mirror('f-sname', 'm-student'); mirror('f-pname', 'm-parent');
    ['f-class', 'f-num'].forEach(function (id) {
      el(id).addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 2); });
    });
    var ph = el('f-phone');
    if (ph) ph.addEventListener('input', function () {
      var d = this.value.replace(/\D/g, '').slice(0, 11);
      this.value = d.length < 4 ? d : d.length < 8 ? d.slice(0, 3) + '-' + d.slice(3) : d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4);
    });
    document.querySelectorAll('#slip input, #slip select, #slip textarea').forEach(function (x) {
      x.addEventListener('input', function () { clearBad(x); }); x.addEventListener('change', function () { clearBad(x); });
    });
    document.querySelectorAll('#slip input[name="f-choice"]').forEach(function (x) {
      x.addEventListener('change', function () { clearBad(el('f-options')); });
    });
    document.querySelectorAll('.sig-slot').forEach(function (b) {
      b.addEventListener('click', function () {
        var who = b.getAttribute('data-who'), label = who === 'student' ? '학생' : '보호자';
        var nm = (el(who === 'student' ? 'f-sname' : 'f-pname') || {}).value || '';
        SigPad.open(label + ' 서명' + (nm.trim() ? ' (' + nm.trim() + ')' : ''), S.strokes[who], function (url, strokes) {
          S.sig[who] = url; S.strokes[who] = strokes;
          b.querySelector('img').src = url; b.classList.add('signed'); clearBad(b);
          b.setAttribute('aria-label', label + ' 서명 다시 하기');
        });
      });
    });
    $('#btnSubmit').addEventListener('click', submit);

    // 회신서가 화면에 안 보일 때 '회신서 작성하기' 버튼
    var fab = $('#fab'), slip = el('slip');
    fab.addEventListener('click', function () { slip.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { fab.hidden = es[0].isIntersecting || es[0].boundingClientRect.top < 0; }, { threshold: 0, rootMargin: '0px 0px -35% 0px' }).observe(slip);
    }
  }
  function clearBad(x) { if (x) x.classList.remove('bad'); }
  function form() {
    var r = S.doc.reply || {}, ch = document.querySelector('#slip input[name="f-choice"]:checked');
    var extras = [], i = 0;
    while (el('f-extra-' + i)) { extras.push(el('f-extra-' + i).value.trim()); i++; }
    return {
      grade: el('f-grade').value, cls: el('f-class').value.trim(), num: el('f-num').value.trim(),
      sname: el('f-sname').value.trim(), pname: el('f-pname').value.trim(), phone: el('f-phone') ? el('f-phone').value.trim() : '',
      choice: ch ? ch.value : '', extras: extras, sigStudent: S.sig.student, sigParent: S.sig.parent, needPhone: !!r.phone
    };
  }
  function check(f) {
    var hasOpt = !!document.querySelector('#slip input[name="f-choice"]');
    if (!f.grade) return ['f-grade', '학년을 골라 주세요.'];
    if (!f.cls || +f.cls < 1) return ['f-class', '반을 숫자로 적어 주세요.'];
    if (!f.num || +f.num < 1) return ['f-num', '번호를 숫자로 적어 주세요.'];
    if (!f.sname) return ['f-sname', '학생 이름을 적어 주세요.'];
    if (!f.pname) return ['f-pname', '보호자 이름을 적어 주세요.'];
    if (f.needPhone && !/^01\d{8,9}$/.test(f.phone.replace(/\D/g, ''))) return ['f-phone', '보호자 연락처를 확인해 주세요. (예: 010-1234-5678)'];
    if (hasOpt && !f.choice) return ['f-options', '선택 항목을 골라 주세요.'];
    if (!f.sigStudent) return [document.querySelector('.sig-slot[data-who="student"]'), '학생 서명을 해 주세요.'];
    if (!f.sigParent) return [document.querySelector('.sig-slot[data-who="parent"]'), '보호자 서명을 해 주세요.'];
    return null;
  }
  function submit() {
    if (S.busy) return;
    var f = form(), bad = check(f);
    if (bad) {
      var t = typeof bad[0] === 'string' ? el(bad[0]) : bad[0];
      t.classList.add('bad'); t.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (t.focus && t.tagName !== 'DIV') setTimeout(function () { t.focus({ preventScroll: true }); }, 350);
      toast(bad[1], 'err'); return;
    }
    S.busy = true;
    var b = $('#btnSubmit'); b.disabled = true; b.textContent = '제출하는 중…';
    api('submitReply', { id: S.id, form: f }).then(function (r) {
      var who = f.grade + '학년 ' + f.cls + '반 ' + f.num + '번 ' + f.sname;
      store('nv_sub_' + S.id, JSON.stringify({ time: r.time, who: who }));
      var box = $('#doneBox'); box.innerHTML = '';
      var d = document.createElement('div'); d.className = 'done';
      d.appendChild(document.createElement('b')).textContent = '✓ 제출되었습니다';
      d.appendChild(document.createElement('div')).textContent = who + ' · ' + r.time + (r.updated ? ' (최신 내용으로 바뀜)' : '');
      d.appendChild(document.createElement('div')).textContent = '이 화면은 닫아도 됩니다.';
      box.appendChild(d);
      banner('');
      b.textContent = '고쳐서 다시 제출하기';
      d.scrollIntoView({ behavior: 'smooth', block: 'center' });
      toast('제출되었습니다. 감사합니다.', 'ok');
    }).catch(function (e) {
      b.textContent = '회신서 제출하기';
      toast(e.message, 'err', 6000);
    }).then(function () { S.busy = false; b.disabled = false; });
  }

  /* ---------- 인쇄 (A4, PDF와 같은 모양) ---------- */
  $('#btnPrint').addEventListener('click', function () {
    if (!S.doc) return;
    var filled = null;
    if (S.doc.type === 'reply') {
      var f = form();
      filled = { grade: f.grade, cls: f.cls, num: f.num, sname: f.sname, pname: f.pname, phone: f.phone, choice: f.choice, extras: f.extras,
        sig: { student: f.sigStudent, parent: f.sigParent }, date: f.sname || f.pname ? ND.toISO(new Date()) : '' };
      if (!f.grade) { filled.grade = ''; }
    }
    ND.paginate(S.doc, S.assets, $('#printHost'), { filled: filled });
    setTimeout(function () { window.print(); }, 300);
  });

  start();
})();
</script>
