<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>가정통신문 만들기 - 세일고등학교</title>
<style>
  body{margin:0;font-family:'Malgun Gothic','맑은 고딕','Nanum Gothic','나눔고딕',sans-serif;background:#f3f5f8;color:#1f2a37}
  .box{max-width:560px;margin:12vh auto;background:#fff;border:1px solid #d7dde5;border-radius:14px;padding:32px 30px;line-height:1.75}
  h1{font-size:21px;margin:0 0 14px;color:#1d4a87}
  p{margin:0 0 10px}
  .muted{color:#5b6675;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <h1>가정통신문 만들기는 학교 교직원 대시보드로 옮겼어요</h1>
  <p>교사망 PC에서 <b>교직원 대시보드</b>에 로그인한 뒤 <b>바로가기 → 가정통신문 만들기</b>로 들어가 주세요.</p>
  <p class="muted">따로 교직원 비밀번호를 넣지 않아도 돼요. 보호자에게 보낸 가정통신문 주소와 QR코드는 예전 그대로 열려요.</p>
</div>
</body>
</html>
